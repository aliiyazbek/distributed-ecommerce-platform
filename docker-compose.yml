x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ecommerce-api:local
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_HTTP_PORTS: "8080"
    ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ecommerce_db;Username=ecommerce_user;Password=ecommerce_password"
    ConnectionStrings__ReadReplicaConnection: "Host=postgres-replica;Port=5432;Database=ecommerce_db;Username=ecommerce_user;Password=ecommerce_password;Timeout=3"
    Redis__ConnectionString: "redis:6379,abortConnect=false,connectTimeout=500,syncTimeout=500"
    RabbitMq__HostName: "rabbitmq"
    RabbitMq__Port: "5672"
    RabbitMq__UserName: "ecommerce"
    RabbitMq__Password: "ecommerce_password"
    GrpcServices__InventoryUrl: "http://inventory-service:50051"
  volumes:
    - uploads-data:/app/wwwroot/images
  depends_on:
    postgres:
      condition: service_healthy
    postgres-replica:
      condition: service_started
    redis:
      condition: service_started
    rabbitmq:
      condition: service_healthy
    inventory-service:
      condition: service_started

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: Dockerfile.worker
  image: ecommerce-worker:local
  environment:
    ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ecommerce_db;Username=ecommerce_user;Password=ecommerce_password"
    RabbitMq__HostName: "rabbitmq"
    RabbitMq__Port: "5672"
    RabbitMq__UserName: "ecommerce"
    RabbitMq__Password: "ecommerce_password"
    Email__Host: "mailpit"
    Email__Port: "1025"
    Email__Security: "None"
    Email__FromAddress: "orders@ecommerce.local"
    Email__FromName: "E-Commerce Store"
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    mailpit:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "wal_keep_size=256MB"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
      PRIMARY_HOST: postgres
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator_password
    entrypoint: ["sh", "/usr/local/bin/replica-entrypoint.sh"]
    ports:
      - "5433:5432"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ecommerce
      RABBITMQ_DEFAULT_PASS: ecommerce_password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ecommerce_user
      DB_PASSWORD: ecommerce_password
      DB_NAME: ecommerce_db
      GRPC_PORT: "50051"
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  api-1:
    <<: *api-common
    hostname: api-1
  api-2:
    <<: *api-common
    hostname: api-2
  api-3:
    <<: *api-common
    hostname: api-3

  worker-1:
    <<: *worker-common
    hostname: worker-1
  worker-2:
    <<: *worker-common
    hostname: worker-2
  worker-3:
    <<: *worker-common
    hostname: worker-3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "5169:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3

volumes:
  pgdata:
  pgdata-replica:
  rabbitmq-data:
  uploads-data: