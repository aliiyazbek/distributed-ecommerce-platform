events {
    worker_connections 1024;
}

http {
    upstream ecommerce_api {
        least_conn;
        server api-1:8080 max_fails=2 fail_timeout=10s;
        server api-2:8080 max_fails=2 fail_timeout=10s;
        server api-3:8080 max_fails=2 fail_timeout=10s;
    }

    upstream ecommerce_signalr {
        ip_hash;
        server api-1:8080 max_fails=2 fail_timeout=10s;
        server api-2:8080 max_fails=2 fail_timeout=10s;
        server api-3:8080 max_fails=2 fail_timeout=10s;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        client_max_body_size 20M;

        location /hubs/ {
            proxy_pass http://ecommerce_signalr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            add_header X-Upstream-Server $upstream_addr always;
        }

        location / {
            proxy_pass http://ecommerce_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            add_header X-Upstream-Server $upstream_addr always;
        }
    }
}