syntax = "proto3";

// This namespace matches the using statement in your OrderService.cs
option csharp_namespace = "Modules.Orders.Integration.Protos";

package inventory;

service InventoryService {
  rpc CheckQuantity (CheckQuantityRequest) returns (QuantityResponse);
  rpc ReserveQuantity (ReserveQuantityRequest) returns (ReservationResponse);
  rpc ReleaseQuantity (ReleaseQuantityRequest) returns (ReservationResponse);

  rpc InitializeStock (InitializeRequest) returns (ReservationResponse);
}

message InitializeRequest {
  string ProductId = 1;
  int32 InitialQuantity = 2;
}

message CheckQuantityRequest {
  string ProductId = 1;
}

message QuantityResponse {
  int32 AvailableQuantity = 1;
}

message ReserveQuantityRequest {
  string ProductId = 1;
  int32 Amount = 2;
  string OrderId = 3;
}

message ReleaseQuantityRequest {
  string ProductId = 1;
  int32 Amount = 2;
  string OrderId = 3;
}

message ReservationResponse {
  bool Success = 1;
  string Message = 2;
}